<style>
html, body {
  height: 800px;
  margin: 0;
  padding: 0;
  font-family: 'Source Sans Pro', 'Roboto', sans-serif;
  background: radial-gradient(circle at 30% 20%, #2c2e3c 0%, #1a1b25 40%, #13141b 100%);
  color: #D7DCEB;
}

/* Widget container */
#chat-widget {
  display: flex;
  flex-direction: column;
  height: 90vh;
  width: 90vw;
  max-width: 800px;
  margin: auto;
  margin-top: 5vh;

  background: linear-gradient(180deg, #333544 0%, #2a2c39 60%, #252632 100%);
  border: 1px solid #3A3F58;
  border-radius: 18px;

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.55),
    0 0 40px rgba(108,115,141,0.15);

  overflow: hidden;
}

/* Header */
#chat-header {
  background: linear-gradient(180deg, #3a3f58 0%, #333544 100%);
  padding: 18px;
  font-size: 16px;
  font-weight: 600;
  text-align: left;
  border-bottom: 1px solid #3A3F58;
  color: #E6EAF7;
}

/* Messages area */
#chat-messages {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
  font-size: 14px;
}

/* Message bubbles */
.message {
  margin-bottom: 14px;
  line-height: 1.5;
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 14px;
  word-break: break-word;
  border: 1px solid rgba(108,115,141,0.25);
}

/* Bot bubble */
.message.bot {
  margin-right: auto;
  background: linear-gradient(180deg, #313340 0%, #2c2e3a 100%);
  color: #D7DCEB;
}

/* User bubble */
.message.user {
  margin-left: auto;
  background: linear-gradient(180deg, #5b74c6 0%, #4f63a8 100%);
  color: #ffffff;
  border: 1px solid rgba(255,255,255,0.08);
}

/* Typing dots */
.typing-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin: 0 2px;
  background-color: #5B7CFF;
  border-radius: 50%;
  animation: blink 1s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0; }
  40% { opacity: 1; }
}

/* Input area */
#chat-input-area {
  display: flex;
  padding: 16px;
  background: #252632;
  border-top: 1px solid #3A3F58;
}

/* Input field */
#chat-input {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #3A3F58;
  background: #1F212B;
  color: #D7DCEB;
  font-size: 14px;
  outline: none;
  margin-right: 10px;
}

#chat-input::placeholder {
  color: #AAB2CF;
}

/* Send button */
#chat-send {
  background: linear-gradient(180deg, #5B7CFF 0%, #4F6DF5 100%);
  color: #ffffff;
  border: none;
  padding: 0 22px;
  cursor: pointer;
  font-size: 14px;
  border-radius: 10px;
  transition: all 0.2s ease;
}

#chat-send:hover {
  background: linear-gradient(180deg, #4F6DF5 0%, #3F5CE0 100%);
  transform: translateY(-1px);
}
</style>

<div id="chat-widget">
  <div id="chat-header">Internet Support Chat</div>
  <div id="chat-messages"></div>
  <div id="chat-input-area">
    <input id="chat-input" placeholder="Type your internet issue..." />
    <button id="chat-send">Send</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
const API_URL = "https://internet-help-chatbot.onrender.com/chat"; // replace with your backend

const messagesDiv = document.getElementById("chat-messages");
const inputField = document.getElementById("chat-input");
const sendBtn = document.getElementById("chat-send");

function addMessage(content, type) {
  const msg = document.createElement("div");
  msg.classList.add("message", type);
  if(type === "bot") msg.innerHTML = marked.parse(content || "");
  else msg.textContent = content;
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showTyping() {
  const msg = document.createElement("div");
  msg.classList.add("message", "bot");
  msg.dataset.typing = true;
  msg.innerHTML = `<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>`;
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return msg;
}

function removeTyping(typingElement) {
  typingElement.remove();
}

let conversation = [
  { role: "system", content: "You are a technical support assistant. You **ONLY** answer questions about internet connectivity, Wi-Fi, routers, modems, ISPs, browsers, online access issues, etc. If aquestion is unrelated, politely refuse and say you only handle internet support."}
];

async function sendMessage() {
  const text = inputField.value.trim();
  if (!text) return;

  addMessage(text, "user");
  inputField.value = "";

  // Add user message to conversation
  conversation.push({ role: "user", content: text });

  const typingEl = showTyping();

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation: conversation })
    });
    const data = await res.json();
    removeTyping(typingEl);

    addMessage(data.reply, "bot");

    // Add bot reply to conversation
    conversation.push({ role: "assistant", content: data.reply });

  } catch (err) {
    removeTyping(typingEl);
    addMessage("Service temporarily unavailable", "bot");
  }
}

sendBtn.addEventListener("click", sendMessage);
inputField.addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>
