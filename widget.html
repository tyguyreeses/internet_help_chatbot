<style>
html, body {
  height: 900px;
  margin: 0;
  padding: 0;
  font-family: 'Source Sans Pro', 'Roboto', sans-serif;

  /* True site-matching neutral black */
  background: #161616;
  color: #D7DCEB;
}

#chat-widget-wrapper {
  position: relative;
  width: 80vw;
  max-width: 900px;
  margin: 10vh auto 0 auto;

  /* Dramatic glow + drop shadow */
  box-shadow:
    0 50px 120px rgba(0,0,0,0.9),
    0 20px 50px rgba(0,0,0,0.7),
    0 0 50px rgba(255,255,255,0.25),
    0 30px 50px rgba(79,109,245,0.3);
  border-radius: 18px;
}


#chat-widget {
  display: flex;
  flex-direction: column;
  height: 80vh;
  width: 100%;
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(
    180deg,
    #23262E 0%,
    #1E2128 55%,
    #181B21 100%
  );
  border: 1px solid rgba(255,255,255,0.2);
}


/* Header */
#chat-header {
  background: linear-gradient(180deg, #262A33 0%, #20232B 100%);
  padding: 18px 22px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  color: #E6EAF7;
}

/* Messages */
#chat-messages {
  flex: 1;
  padding: 28px;
  overflow-y: auto;
  font-size: 14px;
}

/* Message bubbles */
.message {
  margin-bottom: 16px;
  line-height: 1.55;
  max-width: 72%;
  padding: 13px 18px;
  border-radius: 16px;
  word-break: break-word;

  border: 1px solid rgba(255,255,255,0.2);
}

/* Bot */
.message.bot {
  margin-right: auto;
  background: linear-gradient(
    180deg,
    #2A2D36 0%,
    #24262D 100%
  );
  color: #D7DCEB;
}

/* User */
.message.user {
  margin-left: auto;
  background: linear-gradient(
    180deg,
    #5B74D6 0%,
    #4F63A8 100%
  );
  color: #ffffff;
  border: 1px solid rgba(255,255,255,0.2);

  box-shadow:
    0 6px 20px rgba(79,99,168,0.35);
}

/* Typing dots */
.typing-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin: 0 3px;
  background-color: #5B7CFF;
  border-radius: 50%;
  animation: blink 1s infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0; }
  40% { opacity: 1; }
}

/* Input area */
#chat-input-area {
  display: flex;
  padding: 18px 22px;
  background: #171A20;
  border-top: 1px solid rgba(255,255,255,0.2);
}

/* Input field */
#chat-input {
  flex: 1;
  padding: 15px 16px;
  border-radius: 12px;

  border: 1px solid rgba(255,255,255,0.2);
  background: linear-gradient(180deg, #14171C 0%, #101317 100%);
  color: #D7DCEB;
  font-size: 14px;
  outline: none;
  margin-right: 12px;

  box-shadow: inset 0 2px 4px rgba(0,0,0,0.65);
  transition: border 0.2s ease, box-shadow 0.2s ease;
}

#chat-input:focus {
  border: 1px solid #5B7CFF;
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,0.65),
    0 0 16px rgba(91,124,255,0.35);
}

#chat-input::placeholder {
  color: #AAB2CF;
}

/* Send button */
#chat-send {
  background: linear-gradient(180deg, #5B7CFF 0%, #4F6DF5 100%);
  color: #ffffff;
  border: none;
  padding: 0 26px;
  font-size: 14px;
  border-radius: 12px;
  cursor: pointer;

  box-shadow:
    0 8px 24px rgba(79,109,245,0.4);

  transition: all 0.2s ease;
}

#chat-send:hover {
  background: linear-gradient(180deg, #4F6DF5 0%, #3F5CE0 100%);
  transform: translateY(-2px);
  box-shadow:
    0 14px 32px rgba(79,109,245,0.5);
}
</style>

<div id="chat-widget-wrapper">
  <div id="chat-widget">
    <div id="chat-header">Internet Support Chat</div>
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <input id="chat-input" placeholder="Type your internet issue..." />
      <button id="chat-send">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
const API_URL = "https://internet-help-chatbot.onrender.com/chat"; // replace with your backend

const messagesDiv = document.getElementById("chat-messages");
const inputField = document.getElementById("chat-input");
const sendBtn = document.getElementById("chat-send");

function addMessage(content, type) {
  const msg = document.createElement("div");
  msg.classList.add("message", type);
  if(type === "bot") msg.innerHTML = marked.parse(content || "");
  else msg.textContent = content;
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showTyping() {
  const msg = document.createElement("div");
  msg.classList.add("message", "bot");
  msg.dataset.typing = true;
  msg.innerHTML = `<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>`;
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return msg;
}

function removeTyping(typingElement) {
  typingElement.remove();
}

let conversation = [
  { role: "system", content: "You are a technical support assistant. You **ONLY** answer questions about internet connectivity, Wi-Fi, routers, modems, ISPs, browsers, online access issues, etc. If aquestion is unrelated, politely refuse and say you only handle internet support."}
];

async function sendMessage() {
  const text = inputField.value.trim();
  if (!text) return;

  addMessage(text, "user");
  inputField.value = "";

  // Add user message to conversation
  conversation.push({ role: "user", content: text });

  const typingEl = showTyping();

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation: conversation })
    });
    const data = await res.json();
    removeTyping(typingEl);

    addMessage(data.reply, "bot");

    // Add bot reply to conversation
    conversation.push({ role: "assistant", content: data.reply });

  } catch (err) {
    removeTyping(typingEl);
    addMessage("Service temporarily unavailable", "bot");
  }
}

sendBtn.addEventListener("click", sendMessage);
inputField.addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>
